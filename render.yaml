services:
  - type: web
    name: local-guard-connect
    env: node
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run server
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: https://local-guard-connect.onrender.com
      - key: MOBILE_CLIENT_ORIGINS
        value: capacitor://localhost,https://localhost
      - key: NODE_ENV
        value: production
      - key: PUBLIC_API_URL
        value: https://local-guard-connect.onrender.com
      - key: DIGIPAY_API_KEY
        sync: false
      - key: DIGIPAY_ENVIRONMENT
        value: production
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_SITE_URL
        value: https://local-guard-connect.onrender.com
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
